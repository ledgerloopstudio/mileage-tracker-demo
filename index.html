<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mileage & Tax Deduction Tracker</title>
<style>
:root{
  --bg:#F4F6F7; --card:#FFFFFF; --ink:#1B2A36; --ink2:#31485A; --grey:#5A6B78;
  --rule:#E2E6E9; --soft:#F7F8F9; --acc:#0F7B6C; --accL:#E6F2F0;
  --ok:#12B76A; --warn:#B9770E; --bad:#C0392B; --navy:#2E5C8A;
}
[data-dark="1"]{
  --bg:#121A1E; --card:#182226; --ink:#EDEFEF; --ink2:#C7D0D3; --grey:#8FA0A7;
  --rule:#28343A; --soft:#1B262B; --accL:#173832;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);}
.app{max-width:1200px;margin:0 auto;}
header.top{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10;}
.toprow{display:flex;align-items:center;gap:20px;padding:14px 22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:19px;}
.brand .box{width:22px;height:22px;border:3px solid var(--acc);border-radius:6px;}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;}
nav.tabs button{background:none;border:none;padding:9px 14px;border-radius:8px;font-size:15px;font-weight:bold;color:var(--grey);cursor:pointer;}
nav.tabs button.active{background:var(--accL);color:var(--acc);}
.spacer{flex:1;}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:bold;}
main{padding:22px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr;}.grid2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px;}
.kpi .label{font-size:12px;font-weight:bold;color:var(--grey);letter-spacing:.03em;text-transform:uppercase;}
.kpi .val{font-size:30px;font-weight:bold;margin:6px 0 2px;}
.kpi .sub{font-size:12px;color:var(--grey);}
h2{font-size:19px;margin:0 0 4px;}
p.hint{font-size:13px;color:var(--grey);margin:0 0 14px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--grey);padding:8px 10px;border-bottom:1px solid var(--rule);}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold;}
.pill.ok{background:var(--accL);color:var(--acc);}
.pill.low{background:#FCE8CB;color:var(--warn);}
.pill.out{background:#F5D9D6;color:var(--bad);}
.pill.archived{background:var(--soft);color:var(--grey);}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:bold;font-size:14px;cursor:pointer;}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ink2);}
.btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--soft);color:var(--ink);width:100%;}
label{font-size:12px;font-weight:bold;color:var(--grey);display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,18,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:24px;max-width:520px;width:100%;}
.modal h3{margin-top:0;}
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.catbar .track{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden;}
.catbar .fill{height:100%;background:var(--acc);}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);}
.list-item:last-child{border-bottom:none;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
.empty{color:var(--grey);font-size:13px;padding:20px 0;text-align:center;}
footer.note{font-size:12px;color:var(--grey);text-align:center;padding:20px;}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:bold;border:1px solid var(--rule);background:var(--soft);color:var(--ink2);cursor:pointer;}
.chip.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.barrow .lbl{width:70px;font-size:12px;color:var(--grey);flex-shrink:0;}
.barrow .track{flex:1;height:16px;background:var(--soft);border-radius:5px;overflow:hidden;}
.barrow .fill{height:100%;background:var(--navy);}
.barrow .amt{width:78px;text-align:right;font-size:12px;font-weight:bold;flex-shrink:0;}
.demo-banner{position:sticky;top:0;z-index:9999;background:#B9770E;color:#fff;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:9px 14px}
.demo-banner a{color:#fff;text-decoration:underline}
.demo-banner .x{position:absolute;right:10px;top:6px;background:none;border:none;color:#fff;font:inherit;cursor:pointer;opacity:.85;padding:4px 8px}
.demo-banner .x:hover{opacity:1}
.buildstamp{max-width:1180px;margin:0 auto;padding:4px 22px 30px;color:#8A9AA5;font-size:11px;letter-spacing:.04em;text-align:right}
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner">DEMO — example data, add up to 15 of your own trips and see whether it thinks the way you do. Nothing is saved permanently and it can reset any time. <a href="https://www.etsy.com/shop/LedgerLoopStudio" target="_blank" rel="noopener">Buy the full version</a> for your own unlimited, permanent copy.<button class="x" onclick="document.getElementById('demoBanner').style.display='none'" aria-label="Dismiss">✕</button></div>
<div class="app" id="app"></div>

<script id="engine">
/* ===================== PURE FUNCTIONS (unit-testable) ===================== */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseISO(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length!==3) return null;
  var y=parseInt(p[0],10), m=parseInt(p[1],10), d=parseInt(p[2],10);
  if(!y||!m||!d) return null;
  return new Date(y, m-1, d);
}
function todayISO(){ return toISO(new Date()); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function monthKey(iso){ return iso ? iso.slice(0,7) : ""; }
function yearOf(iso){ return iso ? iso.slice(0,4) : ""; }
function uid(){ return "m" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function formatMoney(amount, symbol){
  symbol = symbol || "$";
  var n = Math.round((Number(amount)||0) * 100) / 100;
  var neg = n < 0;
  var s = symbol + Math.abs(n).toFixed(2);
  return neg ? "-" + s : s;
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

/* ---- tax rate presets (2026) ----
   Each preset: unit ("mi"|"km"), tiers = ordered [{upTo, rate}] where upTo is the
   cumulative distance ceiling for that bracket (Infinity for the last one), applied
   to total YEARLY business distance for the vehicle. */
var RATE_PRESETS = {
  US_IRS:  { code:"US_IRS",  label:"USA — IRS standard mileage rate", unit:"mi",
             tiers:[{upTo:Infinity, rate:0.70}] },
  CA_CRA:  { code:"CA_CRA",  label:"Canada — CRA automobile allowance", unit:"km",
             tiers:[{upTo:5000, rate:0.72},{upTo:Infinity, rate:0.66}] },
  UK_HMRC: { code:"UK_HMRC", label:"UK — HMRC approved mileage rate (car/van)", unit:"mi",
             tiers:[{upTo:10000, rate:0.45},{upTo:Infinity, rate:0.25}] },
  AU_ATO:  { code:"AU_ATO",  label:"Australia — ATO cents-per-km method", unit:"km",
             tiers:[{upTo:Infinity, rate:0.88}] },
  CUSTOM:  { code:"CUSTOM",  label:"Custom rate", unit:"mi",
             tiers:[{upTo:Infinity, rate:0.67}] }
};

/* Progressive bracket calculation: distance consumed low-bracket-first. */
function tieredAmount(distance, tiers){
  distance = Math.max(0, Number(distance)||0);
  var remaining = distance, total = 0, prevLimit = 0;
  for(var i=0;i<tiers.length;i++){
    var tier = tiers[i];
    var bandSize = tier.upTo === Infinity ? Infinity : (tier.upTo - prevLimit);
    var used = Math.min(remaining, bandSize);
    total += used * tier.rate;
    remaining -= used;
    prevLimit = tier.upTo;
    if(remaining <= 0) break;
  }
  return round2(total);
}
function tierBreakdown(distance, tiers){
  distance = Math.max(0, Number(distance)||0);
  var remaining = distance, prevLimit = 0, out = [];
  for(var i=0;i<tiers.length;i++){
    var tier = tiers[i];
    var bandSize = tier.upTo === Infinity ? Infinity : (tier.upTo - prevLimit);
    var used = Math.min(remaining, bandSize);
    out.push({ upTo: tier.upTo, rate: tier.rate, distance: used, amount: round2(used*tier.rate) });
    remaining -= used;
    prevLimit = tier.upTo;
  }
  return out;
}

function tripDistance(t){
  var d = Number(t.distance)||0;
  return t.roundTrip ? d*2 : d;
}
function isBusiness(t){ return t.kind === "business"; }
function businessTrips(trips){ return (trips||[]).filter(isBusiness); }
function tripsForYear(trips, year){ return (trips||[]).filter(function(t){ return yearOf(t.date) === year; }); }
function tripsForVehicle(trips, vehicleId){ return (trips||[]).filter(function(t){ return t.vehicleId === vehicleId; }); }

function totalDistance(trips){
  return round2((trips||[]).reduce(function(sum,t){ return sum + tripDistance(t); }, 0));
}
function businessDistance(trips){ return totalDistance(businessTrips(trips)); }
function personalDistance(trips){ return totalDistance((trips||[]).filter(function(t){ return t.kind === "personal"; })); }

function deductionTotal(trips, preset){
  return tieredAmount(businessDistance(trips), preset.tiers);
}
function monthlyBreakdown(trips, preset){
  var byMonth = {};
  businessTrips(trips).forEach(function(t){
    var mk = monthKey(t.date);
    if(!mk) return;
    byMonth[mk] = (byMonth[mk]||0) + tripDistance(t);
  });
  var keys = Object.keys(byMonth).sort();
  return keys.map(function(mk){
    var dist = round2(byMonth[mk]);
    return { month: mk, distance: dist, amount: tieredAmount(dist, preset.tiers) };
  });
}
function tripCountByVehicle(trips, vehicles){
  return (vehicles||[]).map(function(v){
    var vt = tripsForVehicle(trips, v.id);
    return { vehicle: v, trips: vt.length, distance: businessDistance(vt) };
  });
}
function thresholdProgress(distance, tiers){
  var firstTier = tiers[0];
  if(firstTier.upTo === Infinity) return null;
  return { used: Math.min(distance, firstTier.upTo), limit: firstTier.upTo, pct: Math.min(100, Math.round((distance/firstTier.upTo)*100)) };
}
function toCSV(trips, vehicles, preset){
  var rows = [["Date","Vehicle","Purpose","Type","Start","End","Distance ("+preset.unit+")","Round trip","Deduction","Notes"]];
  trips.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(t){
    var v = (vehicles||[]).find(function(x){ return x.id===t.vehicleId; });
    var dist = tripDistance(t);
    var ded = isBusiness(t) ? tieredAmount(dist, preset.tiers) : 0;
    rows.push([t.date, v?v.label:"", t.purpose||"", t.kind, t.startLoc||"", t.endLoc||"", dist, t.roundTrip?"Yes":"No", ded.toFixed(2), t.notes||""]);
  });
  return rows.map(function(r){
    return r.map(function(c){
      var s = String(c);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",");
  }).join("\n");
}

if(typeof module !== "undefined" && module.exports){
  module.exports = {
    pad2, toISO, parseISO, todayISO, addDays, monthKey, yearOf, uid, formatMoney, round2,
    RATE_PRESETS, tieredAmount, tierBreakdown, tripDistance, isBusiness, businessTrips,
    tripsForYear, tripsForVehicle, totalDistance, businessDistance, personalDistance,
    deductionTotal, monthlyBreakdown, tripCountByVehicle, thresholdProgress, toCSV
  };
}
</script>

<script id="uiapp">
(function(){
"use strict";
var KEY = "llsMileageTracker_v1";
/* ---- demo-only limit: this block exists only in the public try-it demo, never in the sold product ---- */
var DEMO_MODE = true, DEMO_TRIP_LIMIT = 22; /* 7 seeded + 15 room to try adding your own */
function demoLimitReached(){
  if(!DEMO_MODE) return false;
  if(!STATE || !STATE.trips || STATE.trips.length < DEMO_TRIP_LIMIT) return false;
  alert("You've reached the "+DEMO_TRIP_LIMIT+"-trip demo limit.\n\nThis is just a preview — buy the full version for unlimited trips, all features unlocked, and your own permanent copy.");
  return true;
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return null;
    var st = JSON.parse(raw);
    if(!st || !st.trips) return null;
    return st;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(STATE)); }catch(e){} }

function seedSample(){
  var today = todayISO();
  var t = parseISO(today);
  function iso(offsetDays){ return toISO(addDays(t, offsetDays)); }
  var vehicles = [
    { id: uid(), label: "Honda Civic 2021", plate: "ABC-1234", notes:"Primary work car" },
    { id: uid(), label: "Ford Transit (van)", plate: "XYZ-5678", notes:"Deliveries" }
  ];
  var v1 = vehicles[0].id, v2 = vehicles[1].id;
  var trips = [
    { id: uid(), date: iso(-2), vehicleId: v1, purpose:"Client meeting", kind:"business", startLoc:"Office", endLoc:"Client HQ", distance: 18.4, roundTrip:true, notes:"" },
    { id: uid(), date: iso(-5), vehicleId: v1, purpose:"Supplies run", kind:"business", startLoc:"Office", endLoc:"Staples", distance: 6.2, roundTrip:true, notes:"" },
    { id: uid(), date: iso(-9), vehicleId: v2, purpose:"Delivery route", kind:"business", startLoc:"Warehouse", endLoc:"Multiple stops", distance: 41.0, roundTrip:false, notes:"5 stops" },
    { id: uid(), date: iso(-14), vehicleId: v1, purpose:"Grocery run", kind:"personal", startLoc:"Home", endLoc:"Market", distance: 3.1, roundTrip:true, notes:"" },
    { id: uid(), date: iso(-20), vehicleId: v1, purpose:"Conference", kind:"business", startLoc:"Office", endLoc:"Downtown Convention Center", distance: 22.0, roundTrip:true, notes:"Annual industry event" },
    { id: uid(), date: iso(-28), vehicleId: v2, purpose:"Delivery route", kind:"business", startLoc:"Warehouse", endLoc:"North district", distance: 33.5, roundTrip:false, notes:"" },
    { id: uid(), date: iso(-40), vehicleId: v1, purpose:"Bank deposit", kind:"business", startLoc:"Office", endLoc:"Bank", distance: 4.8, roundTrip:true, notes:"" }
  ];
  return { settings: { currency:"$", dark:false, country:"US_IRS", customRate:0.67 }, vehicles: vehicles, trips: trips };
}

var STATE = load() || seedSample();
if(!load()) save();

var VIEW = "dash";
var MODAL_OPEN = false;
var EDIT_ID = null;
var EDIT_VEHICLE_ID = null;
var REPORT_YEAR = yearOf(todayISO());

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(k){ if(k) e.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
  return e;
}

var TABS = [
  ["dash","Dashboard"], ["trips","Trip Log"], ["vehicles","Vehicles"],
  ["rates","Tax Rates"], ["reports","Reports"], ["settings","Settings"]
];

function currentPreset(){
  var base = RATE_PRESETS[STATE.settings.country] || RATE_PRESETS.US_IRS;
  if(base.code === "CUSTOM"){
    return { code:"CUSTOM", label:"Custom rate", unit: base.unit, tiers:[{upTo:Infinity, rate: Number(STATE.settings.customRate)||0.67}] };
  }
  return base;
}

function render(){
  document.body.setAttribute("data-dark", STATE.settings.dark ? "1" : "0");
  var app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderHeader());
  var main = el("main", {}, []);
  if(VIEW === "dash") main.appendChild(viewDash());
  else if(VIEW === "trips") main.appendChild(viewTrips());
  else if(VIEW === "vehicles") main.appendChild(viewVehicles());
  else if(VIEW === "rates") main.appendChild(viewRates());
  else if(VIEW === "reports") main.appendChild(viewReports());
  else if(VIEW === "settings") main.appendChild(viewSettings());
  app.appendChild(main);
  app.appendChild(renderFooter());
  showModal();
}

function renderHeader(){
  var nav = el("nav", { class: "tabs" }, TABS.map(function(t){
    return el("button", { class: (VIEW===t[0]?"active ":"")+"", onclick: function(){ VIEW = t[0]; render(); } }, [t[1]]);
  }));
  return el("header", { class: "top" }, [
    el("div", { class: "toprow" }, [
      el("div", { class: "brand" }, [ el("span",{class:"box"},[]), "Mileage Tracker" ]),
      nav,
      el("div", { class: "spacer" }, []),
      el("button", { class: "iconbtn", onclick: function(){ STATE.settings.dark = !STATE.settings.dark; save(); render(); } }, [ STATE.settings.dark ? "Light mode" : "Dark mode" ])
    ])
  ]);
}
function renderFooter(){
  return el("footer", { class: "note" }, ["100% offline. No account, no subscription. Your data stays in this browser."]);
}

/* ---------- Dashboard ---------- */
function viewDash(){
  var cur = STATE.settings.currency;
  var preset = currentPreset();
  var year = yearOf(todayISO());
  var yearTrips = tripsForYear(STATE.trips, year);
  var bDist = businessDistance(yearTrips);
  var pDist = personalDistance(yearTrips);
  var ded = deductionTotal(yearTrips, preset);
  var progress = thresholdProgress(bDist, preset.tiers);
  var byVehicle = tripCountByVehicle(STATE.trips, STATE.vehicles);
  var months = monthlyBreakdown(yearTrips, preset);
  var maxAmt = months.reduce(function(m,x){ return Math.max(m, x.amount); }, 0) || 1;

  var kpis = el("div", { class: "grid4" }, [
    kpiCard("YTD DEDUCTION", formatMoney(ded, cur), preset.label, "var(--ok)"),
    kpiCard("BUSINESS DISTANCE", bDist.toFixed(1) + " " + preset.unit, year + " so far"),
    kpiCard("PERSONAL DISTANCE", pDist.toFixed(1) + " " + preset.unit, "tracked separately, not deducted"),
    kpiCard("TRIPS LOGGED", String(yearTrips.length), STATE.vehicles.length + " vehicle(s) on file")
  ]);

  var threshCard = el("div", { class: "card" }, [
    el("h2", {}, ["Rate threshold"]),
    progress ? el("div", {}, [
      el("p", { class:"hint" }, [ progress.used.toFixed(0) + " / " + progress.limit + " " + preset.unit + " used at the higher rate this year" ]),
      el("div", { class:"catbar" }, [
        el("div", { class:"track" }, [ el("div", { class:"fill", style:"width:"+progress.pct+"%" }, []) ])
      ])
    ]) : el("p", { class:"hint" }, ["This rate has a single flat bracket — no threshold to track."])
  ]);
  var vehCard = el("div", { class: "card" }, [
    el("h2", {}, ["By vehicle"]),
    el("p", { class:"hint" }, ["Business distance, all time."]),
    byVehicle.length ? el("div", {}, byVehicle.map(function(x){
      return el("div", { class:"list-item" }, [
        el("span", {}, [x.vehicle.label]),
        el("span", { style:"font-weight:bold;" }, [x.distance.toFixed(1) + " " + preset.unit])
      ]);
    })) : el("div", { class:"empty" }, ["Add a vehicle to start tracking."])
  ]);

  var monthCard = el("div", { class: "card" }, [
    el("h2", {}, ["Monthly deduction, " + year]),
    el("p", { class: "hint" }, ["Business distance converted to deduction, month by month."]),
    months.length ? el("div", {}, months.map(function(m){
      return el("div", { class:"barrow" }, [
        el("div", { class:"lbl" }, [m.month.slice(5)+"/"+m.month.slice(0,4)]),
        el("div", { class:"track" }, [ el("div", { class:"fill", style:"width:"+Math.round((m.amount/maxAmt)*100)+"%" }, []) ]),
        el("div", { class:"amt" }, [formatMoney(m.amount, cur)])
      ]);
    })) : el("div", { class: "empty" }, ["No business trips logged yet this year."])
  ]);

  return el("div", {}, [ kpis, el("div", { class: "grid2" }, [ threshCard, vehCard ]), monthCard ]);
}
function kpiCard(label, val, sub, colour){
  return el("div", { class: "card kpi" }, [
    el("div", { class: "label" }, [label]),
    el("div", { class: "val", style: colour ? ("color:"+colour) : "" }, [val]),
    el("div", { class: "sub" }, [sub])
  ]);
}

/* ---------- Trip log ---------- */
function viewTrips(){
  var cur = STATE.settings.currency;
  var preset = currentPreset();
  var list = STATE.trips.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var rows = list.map(function(t){
    var v = STATE.vehicles.find(function(x){ return x.id === t.vehicleId; });
    var dist = tripDistance(t);
    var ded = isBusiness(t) ? tieredAmount(dist, preset.tiers) : 0;
    return el("tr", {}, [
      el("td", {}, [t.date]),
      el("td", {}, [ v ? v.label : "(no vehicle)" ]),
      el("td", {}, [ el("strong",{},[t.purpose||""]), el("div",{style:"font-size:12px;color:var(--grey);"},[(t.startLoc||"")+" → "+(t.endLoc||"")]) ]),
      el("td", {}, [ el("span", { class: "pill " + (isBusiness(t)?"ok":"archived") }, [ isBusiness(t)?"Business":"Personal" ]) ]),
      el("td", {}, [ dist.toFixed(1) + " " + preset.unit + (t.roundTrip?" (RT)":"") ]),
      el("td", {}, [ isBusiness(t) ? formatMoney(ded,cur) : "—" ]),
      el("td", {}, [
        el("button", { class: "btn ghost small", onclick: function(){ openEdit(t.id); } }, ["Edit"])
      ])
    ]);
  });
  return el("div", {}, [
    el("div", { class: "row" }, [
      el("h2", {}, ["Trip log"]),
      el("button", { class: "btn", onclick: function(){ openEdit(null); } }, ["+ Add trip"])
    ]),
    el("div", { class: "card" }, [
      list.length ?
      el("table", {}, [
        el("thead", {}, [ el("tr", {}, ["Date","Vehicle","Purpose / route","Type","Distance","Deduction",""].map(function(h){ return el("th",{},[h]); })) ]),
        el("tbody", {}, rows)
      ]) : el("div", { class: "empty" }, ["No trips yet. Add your first one."])
    ])
  ]);
}

/* ---------- Vehicles ---------- */
function viewVehicles(){
  var preset = currentPreset();
  var rows = STATE.vehicles.map(function(v){
    var vt = tripsForVehicle(STATE.trips, v.id);
    return el("tr", {}, [
      el("td", {}, [ el("strong",{},[v.label]) ]),
      el("td", {}, [v.plate||""]),
      el("td", {}, [ String(vt.length) ]),
      el("td", {}, [ businessDistance(vt).toFixed(1) + " " + preset.unit ]),
      el("td", {}, [
        el("button", { class: "btn ghost small", onclick: function(){ openEditVehicle(v.id); } }, ["Edit"])
      ])
    ]);
  });
  return el("div", {}, [
    el("div", { class: "row" }, [
      el("h2", {}, ["Vehicles"]),
      el("button", { class: "btn", onclick: function(){ openEditVehicle(null); } }, ["+ Add vehicle"])
    ]),
    el("div", { class: "card" }, [
      STATE.vehicles.length ?
      el("table", {}, [
        el("thead", {}, [ el("tr", {}, ["Vehicle","Plate","Trips","Business distance",""].map(function(h){ return el("th",{},[h]); })) ]),
        el("tbody", {}, rows)
      ]) : el("div", { class: "empty" }, ["No vehicles yet. Add one to start logging trips."])
    ])
  ]);
}

/* ---------- Tax rates ---------- */
function viewRates(){
  var codes = ["US_IRS","CA_CRA","UK_HMRC","AU_ATO","CUSTOM"];
  var chips = el("div", { class:"chipbar" }, codes.map(function(c){
    var p = RATE_PRESETS[c];
    return el("button", { class:"chip"+(STATE.settings.country===c?" active":""), onclick:function(){ STATE.settings.country = c; save(); render(); } }, [p.label.split(" — ")[0]]);
  }));
  var preset = currentPreset();
  var tierCard = el("div", { class:"card" }, [
    el("h2", {}, [preset.label]),
    el("p", { class:"hint" }, ["Unit: " + preset.unit + ". Applies automatically to every business trip's deduction."]),
    el("table", {}, [
      el("thead", {}, [ el("tr", {}, ["Bracket","Rate per "+preset.unit].map(function(h){return el("th",{},[h]);})) ]),
      el("tbody", {}, tierBreakdown(999999999, preset.tiers).map(function(r,i,arr){
        var lo = i===0 ? 0 : arr[i-1].upTo;
        var label = r.upTo===Infinity ? ("Over " + lo.toLocaleString()) : ("Up to " + r.upTo.toLocaleString());
        return el("tr", {}, [ el("td",{},[label]), el("td",{},[ "$"+r.rate.toFixed(2) ]) ]);
      }))
    ]),
    preset.code === "CUSTOM" ? el("div", { class:"field", style:"margin-top:12px;max-width:220px;" }, [
      el("label",{},["Custom rate per "+preset.unit]),
      el("input", { type:"number", step:"0.01", value: STATE.settings.customRate, oninput:function(e){ STATE.settings.customRate = e.target.value; save(); render(); } })
    ]) : el("span",{},[])
  ]);
  return el("div", {}, [
    el("h2", {}, ["Tax rate presets"]),
    el("p", { class:"hint" }, ["Choose the jurisdiction you file under. Rates are the standard published mileage/kilometre allowances and update as tax authorities revise them — always confirm the current published rate before filing."]),
    chips,
    tierCard
  ]);
}

/* ---------- Reports ---------- */
function viewReports(){
  var cur = STATE.settings.currency;
  var preset = currentPreset();
  var years = Array.from(new Set(STATE.trips.map(function(t){ return yearOf(t.date); }))).filter(Boolean).sort();
  if(!years.length) years = [yearOf(todayISO())];
  if(years.indexOf(REPORT_YEAR)===-1) REPORT_YEAR = years[years.length-1];
  var yearTrips = tripsForYear(STATE.trips, REPORT_YEAR);
  var ded = deductionTotal(yearTrips, preset);
  var bDist = businessDistance(yearTrips);

  var yearChips = el("div", { class:"chipbar" }, years.map(function(y){
    return el("button", { class:"chip"+(REPORT_YEAR===y?" active":""), onclick:function(){ REPORT_YEAR = y; render(); } }, [y]);
  }));

  return el("div", {}, [
    el("div", { class:"row" }, [
      el("h2", {}, ["Annual deduction summary"]),
      el("button", { class:"btn", onclick: function(){ downloadCSV(); } }, ["Export CSV"])
    ]),
    yearChips,
    el("div", { class:"grid2" }, [
      el("div", { class:"card kpi" }, [
        el("div", { class:"label" }, ["TOTAL DEDUCTION, " + REPORT_YEAR]),
        el("div", { class:"val", style:"color:var(--ok)" }, [ formatMoney(ded, cur) ]),
        el("div", { class:"sub" }, [ bDist.toFixed(1) + " " + preset.unit + " of business driving, " + preset.label ])
      ]),
      el("div", { class:"card" }, [
        el("h2", {}, ["Rate bracket used"]),
        el("div", {}, tierBreakdown(bDist, preset.tiers).map(function(r,i,arr){
          var lo = i===0?0:arr[i-1].upTo;
          var label = r.upTo===Infinity ? ("Over "+lo.toLocaleString()) : ("Up to "+r.upTo.toLocaleString());
          return el("div", { class:"list-item" }, [
            el("span", {}, [ label + " @ $"+r.rate.toFixed(2) ]),
            el("span", { style:"font-weight:bold;" }, [ r.distance.toFixed(1)+" "+preset.unit+" = "+formatMoney(r.amount,cur) ])
          ]);
        }))
      ])
    ]),
    el("div", { class:"card" }, [
      el("h2", {}, ["Ready for your accountant"]),
      el("p", { class:"hint" }, ["Export a full CSV of every trip in this log — date, vehicle, purpose, distance, and calculated deduction — ready to hand off or attach to your return."]),
      el("button", { class:"btn ghost", onclick: function(){ downloadCSV(); } }, ["Export CSV"])
    ])
  ]);
}
function downloadCSV(){
  var preset = currentPreset();
  var csv = toCSV(STATE.trips, STATE.vehicles, preset);
  var blob = new Blob([csv], {type:"text/csv"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = "mileage-tracker-export.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---------- Settings ---------- */
function viewSettings(){
  return el("div", {}, [
    el("h2", {}, ["Settings"]),
    el("div", { class: "card", style:"margin-bottom:16px;" }, [
      el("div", { class:"field" }, [ el("label",{},["Currency symbol"]),
        el("input", { value: STATE.settings.currency, oninput: function(e){ STATE.settings.currency = e.target.value || "$"; save(); render(); } }) ])
    ]),
    el("div", { class: "card" }, [
      el("h2", {}, ["Your data"]),
      el("p", { class:"hint" }, ["Everything lives in this browser's local storage. Nothing is uploaded anywhere."]),
      el("button", { class:"btn ghost", style:"margin-right:8px;", onclick: exportData }, ["Export backup (.json)"]),
      el("button", { class:"btn ghost", onclick: function(){
        var inp = document.createElement("input"); inp.type="file"; inp.accept="application/json";
        inp.onchange = function(e){ importData(e.target.files[0]); };
        inp.click();
      } }, ["Import backup"]),
      el("button", { class:"btn ghost", style:"margin-left:8px;color:var(--bad);", onclick: function(){
        if(confirm("Reset all data? This cannot be undone.")){ STATE = { settings:{currency:"$",dark:false,country:"US_IRS",customRate:0.67}, vehicles:[], trips:[] }; save(); render(); }
      } }, ["Reset all data"])
    ])
  ]);
}
function exportData(){
  var blob = new Blob([JSON.stringify(STATE,null,2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = "mileage-tracker-backup.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importData(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var st = JSON.parse(e.target.result);
      if(st && st.trips){ STATE = st; save(); render(); }
    }catch(err){ alert("Could not read that file."); }
  };
  reader.readAsText(file);
}

/* ---------- Add / Edit trip modal ---------- */
function openEdit(id){ EDIT_ID = id; EDIT_VEHICLE_ID = null; MODAL_OPEN = "trip"; render(); }
function openEditVehicle(id){ EDIT_VEHICLE_ID = id; EDIT_ID = null; MODAL_OPEN = "vehicle"; render(); }
function closeModal(){ MODAL_OPEN = false; EDIT_ID = null; EDIT_VEHICLE_ID = null; render(); }

function showModal(){
  var app = document.getElementById("app");
  var existing = document.getElementById("mtModalBg");
  if(existing) existing.remove();
  if(!MODAL_OPEN) return;
  if(MODAL_OPEN === "trip") return showTripModal(app);
  if(MODAL_OPEN === "vehicle") return showVehicleModal(app);
}

function showTripModal(app){
  var s = EDIT_ID === null ? null : STATE.trips.find(function(x){ return x.id === EDIT_ID; });
  var isNew = !s;
  var draft = s ? JSON.parse(JSON.stringify(s)) : {
    id: uid(), date: todayISO(), vehicleId: STATE.vehicles.length?STATE.vehicles[0].id:"",
    purpose:"", kind:"business", startLoc:"", endLoc:"", distance:"", roundTrip:false, notes:""
  };
  var preset = currentPreset();

  var dateInput = el("input", { type:"date", value: draft.date, oninput: function(e){ draft.date = e.target.value; } });
  var vehicleSelect = STATE.vehicles.length
    ? el("select", {}, STATE.vehicles.map(function(v){ var o=el("option",{value:v.id},[v.label]); if(v.id===draft.vehicleId) o.selected=true; return o; }))
    : el("div", { class:"hint" }, ["Add a vehicle first, on the Vehicles tab."]);
  if(STATE.vehicles.length) vehicleSelect.addEventListener("change", function(e){ draft.vehicleId = e.target.value; });
  var purposeInput = el("input", { value: draft.purpose, oninput: function(e){ draft.purpose = e.target.value; } });
  var kindSelect = el("select", {}, ["business","personal"].map(function(c){ var o=el("option",{value:c},[c==="business"?"Business":"Personal"]); if(c===draft.kind) o.selected=true; return o; }));
  kindSelect.addEventListener("change", function(e){ draft.kind = e.target.value; });
  var startInput = el("input", { value: draft.startLoc, oninput: function(e){ draft.startLoc = e.target.value; } });
  var endInput = el("input", { value: draft.endLoc, oninput: function(e){ draft.endLoc = e.target.value; } });
  var distInput = el("input", { type:"number", step:"0.1", value: draft.distance, oninput: function(e){ draft.distance = e.target.value; } });
  var rtSelect = el("select", {}, ["no","yes"].map(function(c){ var o=el("option",{value:c},[c==="yes"?"Yes — double the distance":"No"]); if((draft.roundTrip?"yes":"no")===c) o.selected=true; return o; }));
  rtSelect.addEventListener("change", function(e){ draft.roundTrip = e.target.value === "yes"; });
  var notesInput = el("textarea", { rows:2, oninput: function(e){ draft.notes = e.target.value; } }, [draft.notes||""]);

  var modal = el("div", { class:"modal" }, [
    el("h3", {}, [ isNew ? "Add trip" : "Edit trip" ]),
    el("p", { class:"hint" }, ["Distance is in " + preset.unit + " (matches your selected tax rate on the Tax Rates tab)."]),
    el("div", { class: "formgrid" }, [
      el("div", { class: "field" }, [ el("label",{},["Date"]), dateInput ]),
      el("div", { class: "field" }, [ el("label",{},["Vehicle"]), vehicleSelect ]),
      el("div", { class: "field", style:"grid-column:1/-1;" }, [ el("label",{},["Purpose"]), purposeInput ]),
      el("div", { class: "field" }, [ el("label",{},["Type"]), kindSelect ]),
      el("div", { class: "field" }, [ el("label",{},["Round trip?"]), rtSelect ]),
      el("div", { class: "field" }, [ el("label",{},["Start"]), startInput ]),
      el("div", { class: "field" }, [ el("label",{},["End"]), endInput ]),
      el("div", { class: "field" }, [ el("label",{},["Distance ("+preset.unit+", one-way)"]), distInput ])
    ]),
    el("div", { class: "field" }, [ el("label",{},["Notes"]), notesInput ]),
    el("div", { class: "row", style:"margin-top:6px;" }, [
      isNew ? el("span",{},[]) : el("button", { class:"btn ghost", style:"color:var(--bad);", onclick: function(){
        if(confirm("Delete this trip?")){ STATE.trips = STATE.trips.filter(function(x){ return x.id !== draft.id; }); save(); closeModal(); }
      } }, ["Delete"]),
      el("div", {}, [
        el("button", { class:"btn ghost", style:"margin-right:8px;", onclick: closeModal }, ["Cancel"]),
        el("button", { class:"btn", onclick: function(){
          if(!draft.vehicleId){ alert("Add a vehicle first, then log the trip."); return; }
          if(!(Number(draft.distance) > 0)){ alert("Enter a distance greater than zero."); return; }
          draft.distance = Number(draft.distance)||0;
          if(isNew){ if(demoLimitReached()) return; STATE.trips.push(draft); } else { STATE.trips = STATE.trips.map(function(x){ return x.id === draft.id ? draft : x; }); }
          save(); closeModal();
        } }, [ isNew ? "Add trip" : "Save changes" ])
      ])
    ])
  ]);
  var bg = el("div", { class:"modal-bg open", id:"mtModalBg", onclick: function(e){ if(e.target.id === "mtModalBg") closeModal(); } }, [modal]);
  app.appendChild(bg);
}

function showVehicleModal(app){
  var s = EDIT_VEHICLE_ID === null ? null : STATE.vehicles.find(function(x){ return x.id === EDIT_VEHICLE_ID; });
  var isNew = !s;
  var draft = s ? JSON.parse(JSON.stringify(s)) : { id: uid(), label:"", plate:"", notes:"" };

  var labelInput = el("input", { value: draft.label, oninput: function(e){ draft.label = e.target.value; } });
  var plateInput = el("input", { value: draft.plate, oninput: function(e){ draft.plate = e.target.value; } });
  var notesInput = el("textarea", { rows:2, oninput: function(e){ draft.notes = e.target.value; } }, [draft.notes||""]);

  var modal = el("div", { class:"modal" }, [
    el("h3", {}, [ isNew ? "Add vehicle" : "Edit vehicle" ]),
    el("div", { class: "field" }, [ el("label",{},["Vehicle name"]), labelInput ]),
    el("div", { class: "field" }, [ el("label",{},["Plate / ID (optional)"]), plateInput ]),
    el("div", { class: "field" }, [ el("label",{},["Notes"]), notesInput ]),
    el("div", { class: "row", style:"margin-top:6px;" }, [
      isNew ? el("span",{},[]) : el("button", { class:"btn ghost", style:"color:var(--bad);", onclick: function(){
        if(confirm("Delete this vehicle? Its logged trips will stay in the log but show as unassigned.")){ STATE.vehicles = STATE.vehicles.filter(function(x){ return x.id !== draft.id; }); save(); closeModal(); }
      } }, ["Delete"]),
      el("div", {}, [
        el("button", { class:"btn ghost", style:"margin-right:8px;", onclick: closeModal }, ["Cancel"]),
        el("button", { class:"btn", onclick: function(){
          if(!draft.label){ alert("Give the vehicle a name."); return; }
          if(isNew){ STATE.vehicles.push(draft); } else { STATE.vehicles = STATE.vehicles.map(function(x){ return x.id === draft.id ? draft : x; }); }
          save(); closeModal();
        } }, [ isNew ? "Add vehicle" : "Save changes" ])
      ])
    ])
  ]);
  var bg = el("div", { class:"modal-bg open", id:"mtModalBg", onclick: function(e){ if(e.target.id === "mtModalBg") closeModal(); } }, [modal]);
  app.appendChild(bg);
}

render();

if(typeof window !== "undefined"){
  window.__mileageTrackerTest = {
    render: render,
    getState: function(){ return STATE; },
    setState: function(st){ STATE = st; },
    setView: function(v){ VIEW = v; render(); },
    openEdit: openEdit,
    openEditVehicle: openEditVehicle,
    closeModal: closeModal,
    currentPreset: currentPreset
  };
}
})();
</script>
<div class="buildstamp noprint">Mileage &amp; Tax Deduction Tracker &middot; build 2026-09-18 &middot; LedgerLoopStudio</div>
</body>
